<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رامتین GPT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#111827;color:#f9fafb;height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:700px;height:100vh;display:flex;flex-direction:column;background:#0f172a}
header{padding:16px 18px;border-bottom:1px solid #263244;background:#111827;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:grid;place-items:center;font-weight:900}
.title{font-size:19px;font-weight:800}.sub{font-size:12px;color:#94a3b8;margin-top:3px}
#chat{flex:1;overflow:auto;padding:18px 14px 100px}
.msg{display:flex;margin:10px 0}.user{justify-content:flex-start}.ai{justify-content:flex-end}
.bubble{max-width:82%;padding:12px 14px;border-radius:18px;line-height:1.8;white-space:pre-wrap}
.user .bubble{background:#263244;border-bottom-right-radius:5px}
.ai .bubble{background:#4f46e5;border-bottom-left-radius:5px}
.welcome{margin:20px auto;text-align:center;color:#cbd5e1;max-width:450px}
.welcome h2{color:#fff}
footer{position:fixed;bottom:0;width:100%;max-width:700px;padding:12px;background:linear-gradient(transparent,#0f172a 22%);display:flex;gap:8px}
form{width:100%;display:flex;gap:8px;background:#1e293b;border:1px solid #334155;border-radius:18px;padding:7px}
input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px;padding:9px}
button{border:0;border-radius:13px;background:#7c3aed;color:#fff;padding:0 18px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">R</div>
  <div><div class="title">رامتین GPT</div><div class="sub">نسخه ۱ • دستیار هوش مصنوعی</div></div>
</header>
<div id="chat">
  <div class="welcome">
    <h2>سلام! من رامتین GPT هستم 🤖</h2>
    <div>پیامت رو پایین بنویس تا با هم شروع کنیم.</div>
  </div>
</div>
<footer>
<form id="form">
<input id="input" autocomplete="off" placeholder="پیامت رو بنویس..." />
<button type="submit">ارسال</button>
</form>
</footer>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), form=document.getElementById('form');
function add(text,type){
  const row=document.createElement('div'); row.className='msg '+type;
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  row.appendChild(b); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}
function reply(t){
  const x=t.trim().toLowerCase();
  if(x.includes('سلام')) return 'سلام رامتین! 👋 به رامتین GPT خوش اومدی.';
  if(x.includes('اسمت')||x.includes('اسم تو')) return 'اسم من رامتین GPT هست 🤖';
  return 'پیامت رو گرفتم! این نسخهٔ اول رامتین GPT هست. برای تبدیل شدن به یک AI واقعی، در مرحلهٔ بعد باید من رو به یک مدل هوش مصنوعی واقعی وصل کنیم.';
}
form.addEventListener('submit',e=>{
  e.preventDefault(); const t=input.value.trim(); if(!t)return;
  add(t,'user'); input.value='';
  setTimeout(()=>add(reply(t),'ai'),350);
});
</script>
</body>
</html>
